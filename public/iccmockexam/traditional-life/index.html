<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traditional Life — IC Simulated Exam</title>
<link rel="stylesheet" href="/iccmockexam/exam.css">
</head>
<body>
<div class="sheet">

  <a class="backlink" href="/iccmockexam">&larr; Reviewers</a>

  <header>
    <div class="eyebrow">Insurance Commission — Simulated Examination</div>
    <h1>Traditional Life</h1>
    <div class="sub">40 multiple choice + 10 true/false · 50 items total · 80% (40/50) required to pass</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 of 50 answered</div>
  </div>

  <div id="resultArea">
    <div class="result-card" id="resultCard">
      <div class="result-verdict" id="resultVerdict"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="reset-link" id="resetLink">Clear answers and retry</div>
    </div>
  </div>

  <div id="quizForm"></div>

  <div class="submit-bar">
    <button id="submitBtn">Submit exam</button>
    <button id="showAnswersBtn">Show answers</button>
    <div class="missing-note" id="missingNote" style="display:none;"></div>
  </div>

</div>

<script src="/iccmockexam/exam.js"></script>
<script>
const mcQuestions = [
{n:1, text:"If a policyowner avails of a claim, what are his basic settlement options?", opts:{A:"Double indemnity, total and permanent disability waiver",B:"Fixed amount, fixed period, life income, interest on deposit",C:"Policy loan, guaranteed insurability",D:"Cash surrender value, automatic premium loan"}, ans:"B"},
{n:2, text:"In which circumstance does an insurance company have the right to rescind a policy?", opts:{A:"Insured person is killed in military action during the contestable period of the policy",B:"Insured person intentionally kills himself during the suicide exclusion period specified on the policy",C:"Company discovers during the contestable period that the application contains a material statement",D:"Company discovers at any time that the policyowner was actually a minor at the time of application"}, ans:"D"},
{n:3, text:"The following are important reasons for requiring insurance agents to be licensed except?", opts:{A:"To establish and maintain high professional and ethical standards",B:"To provide additional income to the government through license fees",C:"To protect the public",D:"To give the government adequate control over the conduct of agents"}, ans:"B"},
{n:4, text:"Gwen is thinking of electing the paid-up insurance option, what will happen to her policy if she does?", opts:{A:"The premiums cease and protection continues with a reduced amount of coverage",B:"The premiums stop and the policy continues for the full face amount until age 65",C:"The insurance continues at a reduced amount and with a reduced premium",D:"The policy will automatically terminate"}, ans:"A"},
{n:5, text:"The company usually allows a policy change from a higher premium to a lower premium if the insured", opts:{A:"Momentarily assigns the policy to the company",B:"Buys a new plan",C:"Presents satisfactory evidence of insurability",D:"Obtains written consent from his or her spouse"}, ans:"C"},
{n:6, text:"What policy permits the policyholder to vary the level of premiums, the sum insured and has its cash values dependent on the investment performance and the level of premiums paid?", opts:{A:"Universal Life",B:"Participating whole life policy",C:"Participating endowment",D:"None of the above"}, ans:"A"},
{n:7, text:"Claire is considering to purchase either endowment or term life policy. What do these policies have in common?", opts:{A:"Insurance protection will be limited to a specific period",B:"Renewal and conversion privileges are available",C:"No cash value is available to the policyowner during the term of the policy",D:"A benefit will be paid at the end of the period of coverage if the person is still alive"}, ans:"A"},
{n:8, text:"Your client George wants to apply for a life insurance policy. As his advisor, you would advise him to do all of the following except", opts:{A:"To furnish initial information as to insurability",B:"To give details pertaining to non-forfeiture options",C:"To convey to the company the desire of the applicant to obtain insurance",D:"To furnish information on which the contract of life insurance may be written"}, ans:"C"},
{n:9, text:"A father has his present life insurance payable to his estate because he has now retired, he wants to pass the policy on to his son who will assume the premium payments. Which of the following will have to appoint his son to achieve his desire and protect the son from Estate Tax Liability?", opts:{A:"Absolute Assignee",B:"Irrevocable primary beneficiary",C:"Revocable primary beneficiary",D:"Irrevocable secondary beneficiary"}, ans:"A"},
{n:10, text:"Which of the following can be done by a policyowner without the written consent of the irrevocable beneficiary/ies?", opts:{A:"After the dividend option now in effect",B:"Avail of a non-forfeiture option",C:"Discontinue premium payments",D:"Borrow minimal cash loan"}, ans:"C"},
{n:11, text:"If Phoebe wants to continue her renewable term insurance, she may", opts:{A:"Change the life insured at renewal date",B:"Renew at the same premium for further period of years",C:"Renew providing the insurance company agrees to continue coverage",D:"Renew the coverage based on a higher premium"}, ans:"D"},
{n:12, text:"Clark applied for a Ps 20,000 whole life policy and paid the full initial premium to his agent, who issued a binding receipt. Under such scenario, the insurance company", opts:{A:"Guarantees the policy will be issued as applied for",B:"Offers permanent insurance coverage effective as of the date of the application",C:"Immediately provides interim insurance that remains in effect until the policy is issued or the application is declined",D:"Promises that the insurance coverage will become effective as of the date of the application is approved"}, ans:"C"},
{n:13, text:"How are endowment life insurance and term life insurance the same?", opts:{A:"Build up cash value rapidly in the early policy years",B:"Provide for payment of the face amount if the insured is alive at the end of the specified period",C:"Contain provision for automatic continuation of the insurance protection at the end of a specified period",D:"Provide life insurance protection for only the period of time specified in the policy contract"}, ans:"D"},
{n:14, text:"Which of the following sales practices determines a prospect's complete financial equipment before offering a policy?", opts:{A:"Planned selling",B:"Counselor selling",C:"Multiple products selling",D:"Total needs selling"}, ans:"D"},
{n:15, text:"A provision in the permanent life insurance policy that grants full coverage for a specified period even if premiums are discontinued", opts:{A:"Paid-up insurance additions",B:"Life income option pension",C:"Reduced paid-up insurance",D:"Extended term insurance"}, ans:"D"},
{n:16, text:'The following statements about "Disability Waiver of Premium Rider" are true except:', opts:{A:"There is a waiting period",B:"Disability must occur before a stated date",C:"The insured has to die while disabled",D:"It has to be attached to a life insurance policy"}, ans:"C"},
{n:17, text:"Life insurance applications usually carry large amount of information that", opts:{A:"Relates to the insurability of the applicant",B:"Identifies the applicant",C:"Describes the desired benefits and mode of payment",D:"Describes the type of insurance applied for"}, ans:"A"},
{n:18, text:"Paid-up additions option is one of the features of a participating policy. Which of the following is TRUE about paid-up additions?", opts:{A:"Don't affect the cash value of the policy",B:"Don't affect the loan or cash value of the policy",C:"Affect both cash and loan value of the policy",D:"Only affect the cash value of the policy"}, ans:"C"},
{n:19, text:"Which rider can increase the total life coverage of a permanent basic policy?", opts:{A:"An accidental death benefit rider",B:"A supplemental term rider",C:"An interim term rider",D:"None of the above"}, ans:"B"},
{n:20, text:"How does the law of probability help life insurance companies?", opts:{A:"Predicts when an individual insured will die",B:"Estimated future death rates among members of a given group",C:"Determines the experienced death rate among the insured persons",D:"Develops statistics of past deaths among the general population"}, ans:"B"},
{n:21, text:"Margaux is the beneficiary of her dad's insurance policy. When it was time for her to make a claim, she was offered different options. Which of the following is not a settlement option?", opts:{A:"Payment of the proceeds over a fixed period",B:"Payment of proceeds for the life of the insured",C:"Payment of the proceeds in fixed amounts until exhausted",D:"Proceeds held by the company, with interest payable to the beneficiary on request"}, ans:"D"},
{n:22, text:"Neal and his wife have a whole life and endowment policies respectively, that is why they are both assured that certain minimum policy benefits will remain with them even under certain changed conditions. Which non-forfeiture provisions holds true with the given situation?", opts:{A:"Any guaranteed policy values will belong to the policyowner even if premium payments are discontinued",B:"No death claim will be denied for any misstatement on the application",C:"The premium on the policy will remain the same even when another beneficiary is added to the policy",D:"The face amount of the policy will remain the same even if the insured's health becomes impaired"}, ans:"A"},
{n:23, text:"William chose a straight premium whole life policy over a limited payment whole life policy. What is the advantage of each purchase?", opts:{A:"Liberal risk selection procedures",B:"Concentration of premium payments during the period of highest earnings",C:"More rapid accumulation of cash values",D:"More insurance protection for the same annual premium holiday"}, ans:"D"},
{n:24, text:"When does an interpleader come into play?", opts:{A:"To decide conflicting claims on the same insurance proceeds",B:"To determine if the cause of the insured's death was an excluded risk",C:"To recommend the best settlement options for the beneficiary if the interest on a policy loan is not paid at the policy anniversary of the insurance",D:"To resolve the question of insurable interest"}, ans:"A"},
{n:25, text:"Brandon advised his friend to get a policy that accumulates cash value because it is beneficial in the long run. Which of the following is false about cash value?", opts:{A:"The cash value in a permanent policy is guaranteed by the company",B:"Because of its very short duration the cash value of a yearly renewable term policy grows very fast",C:"The cash value of a whole life policy builds up at a slower rate than a 20 year endowment",D:"The cash value of an endowment builds up faster than a limited pay life policy."}, ans:"B"},
{n:26, text:"Setting aside possible legal impediments, which option would you recommend if an endowment policyowner at age 65 tells you that he wants to provide his church with a monthly donation for as long as the church exists?", opts:{A:"Interest option",B:"Life annuity option",C:"Fixed income option",D:"Periodic annuity option (fixed interest)"}, ans:"A"},
{n:27, text:"The extent of medical evidence requires is determined by", opts:{A:"Occupation of the applicant",B:"The age of the applicant and the proposed sum to be insured",C:"Date of the last medical examination",D:"Financial condition of the applicant"}, ans:"B"},
{n:28, text:"The conservation of a life insurance policy is dependent on the following, except", opts:{A:"The level of first year commission",B:"Pressure selling",C:"The use of effective needs selling",D:"Agent's service oriented attitude"}, ans:"B"},
{n:29, text:"What source of information pertaining to client's insurability will not be considered by an insurance company?", opts:{A:"Medical examination report",B:"Government tax records",C:"Agent's inspection report",D:"The applicant's personal appearance"}, ans:"B"},
{n:30, text:"If the applicant for life insurance fails to disclose or misrepresents material fact, the contract is", opts:{A:"Void from the beginning",B:"Valid unless the insurer can prove fraud",C:"Valid if the insurer issues a policy which is delivered to the applicant",D:"Voidable by the insurer if it has been in force less than 2 years"}, ans:"D"},
{n:31, text:"What is the purpose of the incontestability clause?", opts:{A:"Permits the company to pay claims within 2 years",B:"Gives the company the right to rescind a policy at the same time",C:"Prevents the company from denying a claim after the policy has been in force for 2 years",D:"Makes it necessary for the beneficiary to present proof of death in the event of a death claim"}, ans:"C"},
{n:32, text:"Simon named of his mother a primary beneficiary and his brother as secondary revocable beneficiary for his Ps. 20,000 policy. Which of the following applies to this situation?", opts:{A:"Upon the insured's death the primary and secondary beneficiaries shall each receive Ps. 10,000.",B:"The designation of a contingent beneficiary is subject to the primary beneficiary's approval",C:"Any policy loan assignment will require the primary beneficiary's signature",D:"The insured can add a third beneficiary at anytime."}, ans:"D"},
{n:33, text:"When you bought an insurance policy on your wife's life, you were 27 and she was 26, but you stated that you were 26 and she was 27. Five years later, your wife died. The insurer will pay", opts:{A:"The face amount adjusted for misstatement of age",B:"Slightly less than the face amount",C:"The sum of the premium paid",D:"The face amount"}, ans:"A"},
{n:34, text:"What will happen if the insured fails to pay the interest on a policy loan during its policy anniversary?", opts:{A:"Terminate the contract",B:"Refuse to grant future additional loan",C:"Increase the present loan by the interest",D:"Demand full settlement of the loan"}, ans:"C"},
{n:35, text:"Jared wants to update his yearly renewable term life insurance policy. Which applies to a yearly renewable term life insurance?", opts:{A:"The policyowner may renew the policy only once",B:"Evidence of insurability shall be required every renewal",C:"Cash values will increase for as long as the policy is in force",D:"Premiums shall increase every time the policy is renewed"}, ans:"D"},
{n:36, text:"The following exhibits a legitimate insurable interest except", opts:{A:"An individual on his own life",B:"An individual on the life of his spouse",C:"A finance company on the life of its borrower",D:"An individual on the life of his mistress"}, ans:"D"},
{n:37, text:"Nicole wants to enhance her existing policy by purchasing a separate provision that provides coverage for a different nature. What will you recommend to her?", opts:{A:"Deposit privileges",B:"Dividends",C:"Riders",D:"Assignment"}, ans:"C"},
{n:38, text:"Which of the following is not true about insurance premiums?", opts:{A:"The grace period is usually 31 days",B:"A premium is the legal consideration needed to effectuate a life insurance policy",C:"Premiums which are paid quarterly or semi-annually are higher than those paid annually",D:"Cash is required for all premiums paid in the grace period"}, ans:"D"},
{n:39, text:"Helena owns a policy that is kept in force by paying the premiums on a semi-annual basis. If she elects a non-forfeiture option, this means, she", opts:{A:"Chooses a mode of settlement for the life proceeds",B:"Discontinues premium payments for a whole life or endowment policy",C:"Converts a term policy to a whole life policy",D:"Renews a term life policy"}, ans:"B"},
{n:40, text:"Harry made a policy loan to pay for the tuition fees of his children. After a year, he is still unable to pay for the loan. What will the insurance company do?", opts:{A:"Increase the present loan by the interest",B:"Demand full settlement of the loan",C:"Refuse to grant future additional loan",D:"Terminate the contract"}, ans:"A"}
];

const tfQuestions = [
{n:1, text:"If the premium has not been paid and the cash values have been exhausted, the grace period provision still applies.", ans:"F"},
{n:2, text:"According to the law of large numbers, events, which happen seemingly by chance, will actually be bound to follow a predictable pattern, if enough such happenings are observed.", ans:"T"},
{n:3, text:"Anti-selection occurs when persons in good health wish to buy insurance.", ans:"F"},
{n:4, text:"If policy is still in force for the full face amount and will remain in force for a further period of four years and 117 days, without the payment of any premiums, this implies that the owner has availed of the paid-up insurance option.", ans:"F"},
{n:5, text:"A participating endowment is a policy that provides guaranteed cash values plus extra annual distributions and pays the insured after a specified time.", ans:"F"},
{n:6, text:"A participating endowment is a policy that provides guaranteed cash values plus extra annual distributions and pays the insured after a specified time.", ans:"T"},
{n:7, text:"In a group insurance, it is assumed that every member of the group is insurable, provided that every member of the group is working a minimum number (usually 60 hours) each week.", ans:"F"},
{n:8, text:"A endowment at age 66 policy with premium payable for a limited period of 20 years pays the full amount after 20 years.", ans:"F"},
{n:9, text:"In most life insurance application, the largest amount of information requested is data which identifies the applicant.", ans:"F"},
{n:10, text:"A misstatement of the assured's age does not make the policy a void contract.", ans:"T"}
];

initExam({
  passPct: 80,
  sections: [
    {title:"Part A — Multiple Choice", type:"mc", key:"mc", shortLabel:"MC", itemLabel:"Question", items: mcQuestions},
    {title:"Part B — True or False", type:"tf", key:"tf", shortLabel:"TF", itemLabel:"Statement", items: tfQuestions}
  ]
});
</script>
</body>
</html>
