<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variable Unit-Linked — IC Simulated Exam</title>
<link rel="stylesheet" href="/iccmockexam/exam.css">
</head>
<body>
<div class="sheet">

  <a class="backlink" href="/iccmockexam">&larr; Reviewers</a>

  <header>
    <div class="eyebrow">Insurance Commission — Simulated Examination</div>
    <h1>Variable Unit-Linked</h1>
    <div class="sub">100 items total · all multiple choice · 80% (80/100) required to pass</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 of 100 answered</div>
  </div>

  <div id="resultArea">
    <div class="result-card" id="resultCard">
      <div class="result-verdict" id="resultVerdict"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="reset-link" id="resetLink">Clear answers and retry</div>
    </div>
  </div>

  <div id="quizForm"></div>

  <div class="submit-bar">
    <button id="submitBtn">Submit exam</button>
    <button id="showAnswersBtn">Show answers</button>
    <div class="missing-note" id="missingNote" style="display:none;"></div>
  </div>

</div>

<script src="/iccmockexam/exam.js"></script>
<script src="/iccmockexam/variable-unit-linked/questions.js"></script>
<script>
initExam({
  passPct: 80,
  sections: [
    {title:"Part A — Multiple Choice", type:"mc", key:"vul", shortLabel:"VUL", itemLabel:"Question", items: vulQuestions}
  ]
});
</script>
</body>
</html>
