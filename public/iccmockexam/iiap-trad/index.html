<script>
const questions = [
{n:1, text:"A single premium policy means a policy", opts:{A:"requiring only a single premium each year",B:"under which only one premium payment is required",C:"only available to single individuals",D:"on which no more than one premium can be paid in advance"}, ans:"B"},
{n:2, text:"A fixed amount added to the premium of a given policy regardless of policy size is known as", opts:{A:"policy fee",B:"policy reserve",C:"policy values",D:"extra premium"}, ans:"A"},
{n:3, text:"To be able to calculate the required premiums for a given policy, the agent must know the applicant's", opts:{A:"age",B:"choice of plan",C:"face amount desired",D:"all of the above"}, ans:"D"},
{n:4, text:"To calculate premiums for the other modes of premium payment the annual premium is", opts:{A:"divided by the desired number of premium payments",B:"divided by a conversion factor for the mode of payment desired",C:"multiplied by a conversion factor for the mode of payment desired",D:"multiplied by a constant conversion factor"}, ans:"C"},
{n:5, text:"Benefits payable under health insurance policies cover", opts:{A:"accidental death and dismemberment benefits",B:"expense reimbursement benefits",C:"disability income benefits",D:"all of the above"}, ans:"D"},
{n:6, text:"With employer–employee groups, an employee does not fill out a personal application for insurance. Instead he merely fills out", opts:{A:"an enrollment card",B:"a registration card",C:"a certificate of insurance coverage",D:"a salary deduction form"}, ans:"A"},
{n:7, text:"In the event an employee leaves the company in which he is a member of its group-insurance policy, his group coverage can be changed to an individual policy using the", opts:{A:"Policy exchange facility",B:"Conversion privilege",C:"Change of plan provision",D:"Policy change form"}, ans:"B"},
{n:8, text:"For a contract to be legal and binding", opts:{A:"Parties to the contract must be members of the bar",B:"Parties to the contract must be legally competent",C:"Parties to the contract must be above 21",D:"Parties to the contract must possess blood relationship"}, ans:"B"},
{n:9, text:"A father enters into a life insurance contract on behalf of his child. In this case, the father is the", opts:{A:"Insured",B:"Beneficiary",C:"Insurer",D:"Applicant-owner"}, ans:"D"},
{n:10, text:"For life insurance coverage to be valid, insurable interest must exist", opts:{A:"Only at the inception of the policy",B:"Only at the time of the loan",C:"Throughout the entire lifetime of the policy",D:"Both at the time of the policy issue and at the time of the loan but not necessarily throughout the lifetime of the policy"}, ans:"A"},
{n:11, text:"The insurance code specifies that a contract does not take effect unless", opts:{A:"the policy is delivered to an insured, his assignee or agent, or to a beneficiary",B:"payment of the first premium is made to the insurer or its authorized agent",C:"no change has taken place in the insurability of the life to be insured between the time the application was completed and the time the policy was delivered",D:"the insured has named in the policy no fewer than two beneficiaries"}, ans:"B"},
{n:12, text:"All of the following would be practicable to become beneficiaries except", opts:{A:"Children by former marriage",B:"Brothers and sisters",C:"Someone who owes you money",D:"Someone to whom you owe money"}, ans:"C"},
{n:13, text:"Under the law pertaining to life insurance", opts:{A:"Only minor children can be named irrevocable beneficiaries",B:"Only the wife can be named irrevocable beneficiary",C:"Only the wife and the children can be named irrevocable beneficiaries",D:"Any person with insurable interest can be named irrevocable beneficiaries"}, ans:"D"},
{n:14, text:"When the proceeds of a life insurance policy are left with the company to earn interest", opts:{A:"Income tax is levied on the proceeds",B:"Income tax is levied on the interest earnings of the proceeds",C:"Estate tax is levied on the proceeds",D:"Donor's tax is levied on the proceeds"}, ans:"B"},
{n:15, text:"A person has insurable interest in the life of", opts:{A:"His child or grandchild",B:"Any person upon whom he is wholly or in part dependent on, or from whom he is receiving support or education",C:"Any person in whom he has pecuniary interest",D:"All of the above"}, ans:"D"},
{n:16, text:"Anybody can be designated a beneficiary except", opts:{A:"A creditor",B:"Minors",C:"Those expressly prohibited by law to receive donations",D:"All of the above"}, ans:"C"},
{n:17, text:"The common practice of most life insurers is that the life insurance goes into force", opts:{A:"When the application is received by the branch office",B:"When the policy is delivered to the applicant",C:"In accordance with the legal stipulation of the insurance code",D:"When the agent gives a binding receipt"}, ans:"D"},
{n:18, text:"The parties involved in a life insurance contract are the", opts:{A:"Insurance company and agent",B:"Insurance company and insured",C:"Agent and insured",D:"Insured and beneficiary"}, ans:"B"},
{n:19, text:"According to insurance law, a common-law spouse cannot be designated a beneficiary", opts:{A:"Since there is no benefit of marriage in the relationship",B:"If his/her legal partner is still living and the previous marriage has not been legally dissolved",C:"Since the common-law relationship is an immoral relationship",D:"All of the above"}, ans:"B"},
{n:20, text:"Which one of the following provisions in a permanent life insurance policy may lapse for non-payment of premium?", opts:{A:"Guaranteed insurability",B:"Automatic premium loan",C:"Settlement options",D:"Reinstatement provision"}, ans:"B"},
{n:21, text:"The convertible feature of a term insurance policy provides that the policy may be", opts:{A:"Changed to a permanent insurance policy without evidence of insurability",B:"Changed to another life",C:"Cashed for a guaranteed sum",D:"Changed to permanent insurance with evidence of insurability"}, ans:"A"},
{n:22, text:"Within two years of buying a life insurance policy, you are accidentally killed when your car hits a tree. In these circumstances the insurance company will", opts:{A:"Refund premiums because it is suicide",B:"Pay double the face amount",C:"Pay the face amount",D:"Pay nothing"}, ans:"C"},
{n:23, text:"A policyholder may obtain money from the insurance company and still remain insured by", opts:{A:"Surrendering the policy for its cash value",B:"Discontinuing payment of premium for some period",C:"Taking a policy loan",D:"Taking the extended insurance option"}, ans:"C"},
{n:24, text:"When you bought an insurance policy on your wife's life you were 27 and she was 26, but you stated that you were 26 and she was 27. Five years later your wife died. The insurance company will pay", opts:{A:"The face amount",B:"The face amount adjusted for misstatement of age",C:"The sum of the premium paid",D:"Slightly less than the face amount"}, ans:"B"},
{n:25, text:"When explaining dividends, the following information must be supplied", opts:{A:"That they are not guaranteed",B:"The dividends paid up in the previous years",C:"The anticipated dividends",D:"The relation to the cost of the policy"}, ans:"A"},
{n:26, text:"If the insured dies during the grace period of an unpaid life insurance policy, the amount payable to the beneficiary is usually the", opts:{A:"Total premiums paid plus interest",B:"Cash surrender value of the policy minus the unpaid premiums",C:"Face amount of the policy minus the unpaid premiums",D:"Full face amount"}, ans:"C"},
{n:27, text:"The typical grace period provision in a life insurance policy obliges the life insurance company to", opts:{A:"Establish a policy loan to cover any premium which the policyowner fails to pay by due date",B:"Keep the policy in force for the duration of any major disability suffered by the policyowner",C:"Allow the policyowner a three-month extension beyond the due date to make the late premium payment without penalty",D:"None of the above"}, ans:"D"},
{n:28, text:"An automatic premium loan differs from other policy loans in that an automatic premium loan", opts:{A:"Need not be repaid by the policyowner",B:"Must be repaid during the policy year in which it is granted",C:"Goes into effect requiring no separate action from the policyowner",D:"Involves higher interest payments because of the greater cost of administration"}, ans:"C"},
{n:29, text:"When a policy is assigned absolutely", opts:{A:"The assignee acquires all the rights and interests of the original policyholder",B:"The original policyholder still can exercise some of the rights",C:"The original beneficiary is not changed",D:"None of the above"}, ans:"A"},
{n:30, text:"If a policy did not contain the name of a beneficiary the beneficiary will be", opts:{A:"The wife",B:"The children",C:"The insured's brothers and sisters",D:"The insured's estate"}, ans:"D"},
{n:31, text:"If a policyowner does not pay a premium on the due date, the policy will immediately", opts:{A:"Lapse",B:"Be converted to a paid up policy for a lesser amount",C:"Go into automatic premium loan",D:"Continue in full force for a period of grace"}, ans:"D"},
{n:32, text:"If a policyowner whose wife is the irrevocable beneficiary wishes to cash in his policy, he must", opts:{A:"Tell his wife what he is going to do",B:"First take a loan on the policy",C:"Have the check issued in the name of his wife",D:"Have the wife's consent"}, ans:"D"},
{n:33, text:"Choose the correct statement. The entire contract between the policyowner and the insurance company includes", opts:{A:"The application and the policy",B:"Any verbal statement made by the agent to the applicant",C:"Any document attached to the policy when issued",D:"Any subsequent written amendments to the contract"}, ans:"B"},
{n:34, text:"If a loan is taken on a participating policy, dividends for that policy while there is a loan against the policy will be", opts:{A:"Suspended",B:"Paid at a reduced rate",C:"Unaffected",D:"Increased"}, ans:"C"},
{n:35, text:"Interest is charged on policy loans", opts:{A:"For registered policies only",B:"If the loan is outstanding for more than a year, a loan repaid within a year is interest free",C:"To replace investment income the insurer cannot earn since a loan has been granted",D:"For participating policies only"}, ans:"C"},
{n:36, text:"An insurance plan which offers both protection and saving is called", opts:{A:"Temporary plan",B:"Permanent plan",C:"Participating plan",D:"Non-participating plan"}, ans:"B"},
{n:37, text:"A man with moderate means can have maximum protection possible through", opts:{A:"20 Yr. Endowment",B:"Limited Pay Life",C:"Term Insurance",D:"Whole life insurance"}, ans:"C"},
{n:38, text:"Mr. Juan Valdez wants a policy which will entitle him to receive dividends yearly. What will you recommend to Mr. Valdez?", opts:{A:"Participating Plans",B:"Non-Participating Plans",C:"Term Insurance",D:"None of the above"}, ans:"A"},
{n:39, text:"Which of the following can give the longest protection?", opts:{A:"20 Yr. Endowment",B:"Endowment at 65",C:"Ordinary Life",D:"20 Yr. Term"}, ans:"C"},
{n:40, text:"An individual at age 35 purchases a policy under which he will in 20 years receive the face amount of the policy himself, if he is still alive at that date. The policy is obviously a", opts:{A:"20 Yr. Endowment",B:"20 Pay Life",C:"20 Yr. Term",D:"None of the above"}, ans:"A"},
{n:41, text:"In a 20 Pay Life policy", opts:{A:"Protection is until age 100, payment of premium is for 20 years",B:"Protection is until age 100, payment of premiums until age 100",C:"Protection is for 20 years, payment of premium is for 20 years",D:"Protection is for 20 years, payment of premiums until age 100"}, ans:"A"},
{n:42, text:"A participating plan entitles the policyowner to receive a return of excess premiums. Such is termed as", opts:{A:"Endowments",B:"Dividends",C:"Cash values",D:"Cash surrender value"}, ans:"B"},
{n:43, text:"Mrs. Rose Cortez owns a policy which does not provide for the build up of cash values and whose premiums remain level. Mrs. Cortez owns", opts:{A:"Ordinary Life",B:"Limited Pay Life",C:"Decreasing term",D:"Level Term"}, ans:"D"},
{n:44, text:"Two attractive features of a term insurance are", opts:{A:"Convertibility and cash values",B:"Cash values and dividends",C:"Protection and dividends",D:"Convertibility and renewability"}, ans:"D"},
{n:45, text:"A term insurance which allows the policyowner to convert it to a permanent insurance within a specified period without evidence of insurability contains the ______ feature", opts:{A:"Convertibility",B:"Renewability",C:"Dividend option",D:"Both a & b"}, ans:"A"},
{n:46, text:"A term policy only offers", opts:{A:"Cash values",B:"Protection",C:"Savings",D:"Dividends"}, ans:"B"},
{n:47, text:"The main difference between a term plan and a permanent plan is", opts:{A:"Permanent plans provide both protection and savings while term plans offer protection only",B:"Permanent plans provide savings and dividends while term plans provide savings only",C:"Permanent plans can be converted and renewed while term plans cannot",D:"All of the above"}, ans:"A"},
{n:48, text:"The savings element of permanent plans allows for the build up of", opts:{A:"Dividends",B:"Cash values",C:"Maturity benefits",D:"Death benefits"}, ans:"B"},
{n:49, text:"A term rider is", opts:{A:"A term policy with a waiver of premium",B:"Another name for a convertible term policy",C:"A renewable term policy",D:"A term insurance added to a permanent plan"}, ans:"D"},
{n:50, text:"An optional rider which can be attached to a policy stopping further premium payments in the event of disability is called", opts:{A:"Policyholder protection clause",B:"Accidental death and dismemberment",C:"Waiver of premium",D:"Total disability monthly income"}, ans:"C"},
{n:51, text:"For the waiver of premium to be effective", opts:{A:"Disability must be total",B:"Disability must be permanent",C:"Both a & b",D:"Either a or b"}, ans:"C"},
{n:52, text:"If a policy with the accidental death rider becomes paid up", opts:{A:"The accidental death rider ceases",B:"The face amount of the policy is reduced",C:"Premiums on the basic policy stop but the rider premium continues",D:"None of the above"}, ans:"A"},
{n:53, text:"Disability benefits are not paid", opts:{A:"For self-inflicted injuries",B:"If there is a loan against the policy",C:"If all the policy dividends have been withdrawn",D:"If disability resulted from sickness only"}, ans:"A"},
{n:54, text:"Mr. Pedro Cruz became paralyzed as a result of jumping out of the window in an attempt to commit suicide. Under the usual provisions of a disability income policy, he would be entitled to", opts:{A:"Receive the total disability income benefit and the waiver of premium",B:"Receive partial disability benefits",C:"Be granted the waiver of premiums",D:"Receive neither disability income nor waiver of premiums"}, ans:"D"},
{n:55, text:"A person wanting a greater coverage for the least amount of premium has an option of attaching what rider in his permanent life policy?", opts:{A:"A waiver of premium",B:"Term insurance rider",C:"Guaranteed insurability rider",D:"Accidental death rider"}, ans:"B"},
{n:56, text:"One supplementary benefit offered is a payor's benefit which is intended to", opts:{A:"Provide for the return of premiums to an adult payor in the event that a minor insured dies",B:"Provide a waiver of premium benefit in the event of death or disability of the person paying the premiums",C:"Allow the insurance company to pay the policy's proceeds to the person who seems equitably entitled to the proceeds",D:"Assure that the adult payor will retain a vested interest in the policy when the insured reaches the age of majority"}, ans:"B"},
{n:57, text:"If an insured is disabled and his life insurance policy is being continued in force through the waiver of premium, the dividends of the policy would", opts:{A:"Cease",B:"Continue at a reduced rate",C:"Continue as if the owner is paying the premium",D:"Continue but they would be applied toward the premium being waived"}, ans:"C"},
{n:58, text:"A policy with a minor as the proposed insured is called", opts:{A:"Rated policy",B:"Juvenile policy",C:"Regular policy",D:"Substandard policy"}, ans:"B"},
{n:59, text:"Life insurance policies for which higher than standard premium rates are payable are said to be", opts:{A:"Rated policies",B:"Contingent policies",C:"Non-participating policies",D:"Conditional policies"}, ans:"A"},
{n:60, text:"Since the purchase of life insurance is a voluntary choice, the individual must meet", opts:{A:"Comprehensive inspection report",B:"Certain standards of health and occupation",C:"Minimum income requirement",D:"All of the above"}, ans:"B"},
{n:61, text:"Which of the following factors would have the least effect on the premium charged for life insurance", opts:{A:"Age",B:"Occupation",C:"Income",D:"All of the above"}, ans:"C"},
{n:62, text:"Anti-selection occurs", opts:{A:"When an agent thinks only of his own interest and not of his policyowners",B:"When you purchase bad stocks with expectation that they will improve",C:"When the insurance company accepts more than its share of poor risks",D:"When persons in poor health wish to buy insurance"}, ans:"D"},
{n:63, text:"In insurance, risk means", opts:{A:"Chances of you being paid by the company",B:"Hazard on people's lives",C:"Chances of the beneficiary being paid",D:"None of the above"}, ans:"B"},
{n:64, text:"In an application, the information that must be disclosed include", opts:{A:"Only his date and place of birth",B:"Only his family history",C:"Every fact in his knowledge that is material to the insurance",D:"Only information he wants the agent to know"}, ans:"C"},
{n:65, text:"Insurance companies have various sources of information on the insured. These are", opts:{A:"Application form",B:"Medical information bureau",C:"Inspection report",D:"All of the above"}, ans:"D"},
{n:66, text:"In insurance, risks are classified as", opts:{A:"Unacceptable and acceptable",B:"Regular and irregular",C:"Standard, substandard and declined",D:"Complete and incomplete"}, ans:"C"},
{n:67, text:"A risk is considered substandard based on any or all of the following criteria", opts:{A:"Death, occupation and moral character",B:"Occupation, moral character and family health history",C:"Income, educational attainment and occupation",D:"Death, income and educational background"}, ans:"B"},
{n:68, text:"A hazardous occupation could be defined as", opts:{A:"An occupation the duties of which expose the insured to a degree of danger of sustaining injury",B:"An occupation in unhealthy working conditions exposing the insured to elements which can cause sickness",C:"An occupation which exposes the insured to social hazards",D:"All of the above"}, ans:"D"},
{n:69, text:"Statements in the application forms are", opts:{A:"Guarantees",B:"Representations",C:"Warranties",D:"None of the above"}, ans:"B"},
{n:70, text:"Mr. Roel Reyes has been confined in a hospital 3 years prior to his application for insurance. He therefore needs to give the following information", opts:{A:"Name of attending doctor, diagnosis, date of confinement",B:"The bill and medicines",C:"Name of doctor only",D:"Date of confinement only"}, ans:"A"},
{n:71, text:"Insurance companies have a source of confidential medical information on applicants for life insurance. This is the", opts:{A:"Agents confidential report bureau",B:"Inspection reports bureau",C:"Financial standing bureau",D:"Medical impairment bureau"}, ans:"D"},
{n:72, text:"An agent is filling up the Agent's Confidential Report. What information must he put in his report?", opts:{A:"Information about the insured's standing in the community",B:"Information about the insured's finances",C:"All information he knows which are material to the application for insurance",D:"A & B only"}, ans:"C"},
{n:73, text:"An annuity plan", opts:{A:"Offers life insurance protection",B:"Offers the waiver of premium benefit",C:"Is the same as an endowment plan",D:"Is a purchase of income"}, ans:"D"},
{n:74, text:"The person who purchases the annuity plan is called the", opts:{A:"Assignor",B:"Owner",C:"Insured",D:"Annuitant"}, ans:"D"},
{n:75, text:"A life insurance company earns income from two main sources", opts:{A:"Premium income and investment income",B:"Mortgage income and premium income",C:"Dividend income and interest income",D:"Mortgage income and dividend income"}, ans:"A"},
{n:76, text:"Policy reserves are future obligations on the part of", opts:{A:"The Insurance Commission",B:"The Insurance Company",C:"The beneficiary",D:"The policyowner"}, ans:"B"},
{n:77, text:"Insurance companies which are owned by the policyowners are examples of", opts:{A:"Stock companies",B:"Mutual companies",C:"Family corporation",D:"Open-end companies"}, ans:"B"},
{n:78, text:"Stock companies are owned by", opts:{A:"Policyowners",B:"Stockholders",C:"Creditors",D:"Government"}, ans:"B"},
{n:79, text:"In the case of life insurance a sale is considered completed if the application is signed and payment of the first premium is made by the applicant. For the sale to be considered completed", opts:{A:"A medical examination has to be made first",B:"Payment of the first premium has to be made by the applicant in full or in part, as specified. One of the acceptable methods of settlement is by cash or check in part, with a note for the balance",C:"Payment of the first premium has to be made in full by a note first",D:"The first premium has to be paid for in full and in cash"}, ans:"A"},
{n:80, text:"Why is it important that the application is the basis of the policy?", opts:{A:"Because the completed application is the policy contract and the company may accept or reject an application based on the information given in the application",B:"For the agent to have available data of his prospect in connection with future sales",C:"To avoid the necessity of the insurer putting all relevant details in the contract",D:"None of the above"}, ans:"A"},
{n:81, text:"Which one of the following statements is correct?", opts:{A:"Advertising by life insurance agents is prohibited",B:"All information about a client or a prospective client has to be treated as confidential",C:"The agent should always recommend the amount and type of policy to a prospective client which would be profitable for the company",D:"When an agent advertises his services in the press, he is not allowed to state the name of his company"}, ans:"B"},
{n:82, text:"All of the following statements regarding a life insurance application are not correct except", opts:{A:"It must be signed by the applicant",B:"Usually it will be made a part of the policy contract",C:"Misstatements of material facts could avoid the policy during the contestable period",D:"Statements made on the application are warranties"}, ans:"D"},
{n:83, text:"Prior to granting a license, the IC requires proof of", opts:{A:"A clean record of employment",B:"A reasonable educational background",C:"A prospective agent's character and reputation",D:"All of the above"}, ans:"D"},
{n:84, text:"The IC has the power to adjudicate insurance claims against insurance companies for any single claim not exceeding", opts:{A:"P 1,000,000.00",B:"P 250,000.00",C:"P 100,000.00",D:"P 500,000.00"}, ans:"C"},
{n:85, text:"Which one of the following statements is correct?", opts:{A:"An insurance agent's license will be renewed when the Commissioner is satisfied that the information in the application is accurate and all requirements are met",B:"An insurance agent's license is valid only for one month",C:"An insurance agent's license is valid during the lifetime of the agent",D:"An insurance agent's license will be renewed when the corresponding application and fee are received by the Insurance Commissioner"}, ans:"A"},
{n:86, text:"The insurance industry is under government regulation because", opts:{A:"It is required to account for money spent in company operations",B:"It pays high taxes",C:"It affects public interest",D:"It is a charitable institution"}, ans:"C"},
{n:87, text:"Which one of the following statements is correct?", opts:{A:"An agent is allowed to share commissions when selling a whole life policy but not when selling a term policy",B:"An agent is allowed to share commissions with another licensed agent or agents but with no one else",C:"Sharing the commission with any other person is called twisting",D:"An agent is not allowed to share commissions with any person"}, ans:"B"},
{n:88, text:"Which one of the following statements is correct?", opts:{A:"Rebating of premiums can only be authorized by the head office of the insurer",B:"A life insurance agent is not allowed to identify on his letterhead the name of the insurer he represents",C:"Life insurance agents are allowed to act for two insurers at the same time under the same license",D:"Rebating of premiums by an insurance agent is prohibited"}, ans:"D"},
{n:89, text:"Persuading a policyowner, directly or indirectly, to surrender or lapse a policy in one company and replacing it with a policy in another company is", opts:{A:"Rebating",B:"Twisting",C:"Knocking",D:"Discounting"}, ans:"B"},
{n:90, text:"Rebating is", opts:{A:"Dating the policy a month in advance",B:"Giving false information",C:"Twisting",D:"Premium discrimination against policyholders"}, ans:"D"},
{n:91, text:"An insurance agent's license can be revoked for", opts:{A:"Fraudulent practices",B:"Violation of any provision of the Insurance Code",C:"Misrepresentation in the application for license",D:"Any or all of the above"}, ans:"D"},
{n:92, text:"One example covered under the ethical practices and procedures is", opts:{A:"Keep all policyholders' information confidential",B:"Always recommend a will",C:"Never drink in front of a client",D:"Always pick up the first premium with the application for insurance"}, ans:"A"},
{n:93, text:"The term knocking means", opts:{A:"Promising to pay two annuitants a fixed annual income as long as both survive",B:"Making derogatory remarks about competing underwriters or companies",C:"The number of years that a person at a given age will live on the average as shown by the mortality table",D:"None of the above"}, ans:"B"},
{n:94, text:"The following are unethical practices in the solicitation and procurement of insurance except", opts:{A:"Misleading estimates of the dividends or share of surplus to be received thereon",B:"Inducing a policyholder to lapse, forfeit or surrender a policy he holds for another company",C:"Misrepresenting the terms of any policy issued by any insurance company or the benefits or advantages promised thereon",D:"Obtaining or attempting to obtain a license by fraud or misrepresentation"}, ans:"D"},
{n:95, text:"Twisting is", opts:{A:"Paying the premium on one policy by surrendering the dividends of another policy",B:"The replacement of a policy in one company with another policy in another company",C:"An attempt made by an insurance company to secure the services of an agent from another company",D:"An offense which does not apply to variable concepts"}, ans:"B"},
{n:96, text:"The misstatement of facts by either of the parties of insurance to the other, whether in writing or orally, preliminary to and in reference to making the insurance contract is", opts:{A:"Knocking",B:"Overloading",C:"Misrepresentation",D:"Twisting"}, ans:"C"},
{n:97, text:"Selling a person more insurance than what is warranted by his resources is called", opts:{A:"Overloading",B:"Twisting",C:"Rebating",D:"Knocking"}, ans:"A"},
{n:98, text:"An agent is prohibited from doing all the following except", opts:{A:"Alter an application without the applicant's prior written approval",B:"Convince a prospective client to cancel his policy in one insurance company in order to buy a policy in the insurance company represented by the agent",C:"Refund some of his commission to his client",D:"Make complete comparisons of policies he sells and those offered by competing insurance companies"}, ans:"D"},
{n:99, text:"Inducing an insured to lapse or forfeit his insurance", opts:{A:"Is not allowed by the conditions of the contract",B:"Is always to the advantage of the policyholder",C:"Is an offense in the great majority of cases",D:"Is a matter left entirely to the discretion of the agent"}, ans:"C"},
{n:100, text:"The suicide clause is in effect for", opts:{A:"The first 6 months",B:"The first year",C:"The first 2 years",D:"The first 18 months"}, ans:"C"},
{n:101, text:"The three non-forfeiture values in a permanent policy are", opts:{A:"Cash dividends, bonus additions and extended term insurance",B:"Cash surrender value, loan value, assignment",C:"Waiver of premium, reinstatement and the policy loan",D:"Cash surrender value, paid up value, extended term insurance"}, ans:"D"},
{n:102, text:"In the event that a policyowner elects the paid up insurance option", opts:{A:"The premiums stop and the policy continues for the full face amount until age 65",B:"The premiums cease and protection continues with a reduced amount of coverage",C:"The insurance continues at a reduced amount and with a reduced premium",D:"The policy will automatically terminate"}, ans:"B"},
{n:103, text:"What are the basic settlement options?", opts:{A:"Cash surrender value, automatic premium loan",B:"Fixed amount, fixed period, interest, fixed period and for life",C:"Double indemnity, total disability waiver of premium",D:"Policy loans, assignment, beneficiary designation"}, ans:"B"},
{n:104, text:"In case of misstatement of age", opts:{A:"The policy is cancelled and a new one is issued for the correct age",B:"The insured can be changed",C:"The amount of insurance is adjusted to the amount which the premium paid at the correct age would have purchased",D:"The policy remains in force and the company cannot contest it"}, ans:"C"},
{n:105, text:"Which of the following is a settlement option", opts:{A:"Policy loan",B:"Cash surrender value",C:"Extended term insurance option",D:"Interest on insurance proceeds"}, ans:"D"},
{n:106, text:"Name the provision in a permanent life insurance policy under which, if the premiums are discontinued, full insurance coverage will be maintained for a specified period", opts:{A:"Extended term insurance",B:"Paid up insurance",C:"Paid up additions",D:"Life income option"}, ans:"A"},
{n:107, text:"Which one of the following is not derived from the non-forfeiture values", opts:{A:"Cash surrender value",B:"Paid up insurance",C:"Dividends",D:"Extended term insurance"}, ans:"C"},
{n:108, text:"Mr. Dela Cruz stated in his application that he was 30 years of age and a policy was issued to him on that basis. When he died twenty years later it was found out that, in fact, he was 34 years of age at the time of his application. In conformity with the Insurance Code, the company", opts:{A:"Paid the amount of insurance payable to his beneficiary reduced in relation to his actual age at the time the contract was signed",B:"Paid one half of the face value of the policy",C:"Need not pay the face value of the policy, but refund all premiums paid",D:"Paid the full face value of the policy without any extra charges"}, ans:"A"},
{n:109, text:"In the event the policyowner elects the paid-up insurance option", opts:{A:"Premiums stop and the policy continues for the full face amount until age 65",B:"Premiums cease and protection continues for a reduced amount",C:"Insurance continues at a reduced amount and with reduced premium",D:"The policy will automatically terminate"}, ans:"B"},
{n:110, text:"If a policyowner commits suicide within one year, what is the company's liability?", opts:{A:"The company is not liable at all",B:"The company would be liable for the payment of the face value of the policy",C:"The company would be liable for the payment of the premiums paid by the insured only",D:"None of the above"}, ans:"C"},
{n:111, text:"Which of the non-forfeiture options gives the largest amount of protection?", opts:{A:"Fully paid insurance",B:"Cash surrender value",C:"Extended term insurance",D:"All of the above give equal protection"}, ans:"C"},
{n:112, text:"Any policy which has lapsed can be reinstated subject to normal conditions of proof of insurability within", opts:{A:"Three years",B:"Six months",C:"One year",D:"Two years"}, ans:"A"},
{n:113, text:"Life insurance is", opts:{A:"A luxury afforded by the rich",B:"Only available to a specific group",C:"A cooperative risk-sharing plan",D:"A speculative risk"}, ans:"C"},
{n:114, text:"The official who makes the necessary assumptions and calculations in respect of the principal elements in life insurance premiums in order to arrive at the premium rates to be charged is the", opts:{A:"Life agent",B:"Senior statistician",C:"Insurance Commissioner",D:"Actuary"}, ans:"D"},
{n:115, text:"Since the purchase of life insurance is a voluntary choice, the individual must meet", opts:{A:"A comprehensive inspection report",B:"Certain standards of health and occupation",C:"A satisfactory medical examination",D:"A minimum income figure"}, ans:"B"},
{n:116, text:"The fundamental advantage of the use of insurance as a means of meeting economic losses is that through insurance these losses are", opts:{A:"Spread over a large number of people",B:"Deferred for a specified period of time",C:"Reduced for the group as a whole through the multiplier effect",D:"Met as they arise through savings accumulated on an assessment basis"}, ans:"A"},
{n:117, text:"The term loading means", opts:{A:"The difference between the gross and net premiums for the purpose of paying the insurance overhead expenses including commissions and taxes",B:"The amount which the company will lend to the policyholder with the policy as security",C:"The amount payable in the event of the occurrence of a loss which renders him unfit for insurance",D:"None of the above"}, ans:"A"},
{n:118, text:"Life insurance contributes directly to the welfare and progress of the country by", opts:{A:"Accumulating capital for investment in commerce and industry",B:"Partially relieving the community of the care of dependents",C:"Encouraging provisions for the future",D:"All of the above"}, ans:"D"},
{n:119, text:"Life insurance can provide money when income stops because of", opts:{A:"Disability",B:"Death",C:"Retirement",D:"All of the above"}, ans:"D"},
{n:120, text:"The three elements that make up a life insurance premium are", opts:{A:"Mortality experience, investment earnings and operating expenses",B:"Cash values, dividends and paid up values",C:"Cash values, loan values and paid up values",D:"Past dividend experience, present dividend and projected interest"}, ans:"A"},
{n:121, text:"The number of years that persons at a given age will live on the average as shown by the mortality table is called", opts:{A:"Law of large numbers",B:"Life income option",C:"Life annuity",D:"Life expectancy"}, ans:"D"},
{n:122, text:"Part of the premium paid by a policyholder is invested by the insurance company. In premium computation, this factor is known as", opts:{A:"Interest",B:"Investment",C:"Loading",D:"Mortality"}, ans:"A"}
